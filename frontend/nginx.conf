server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version from response headers
    server_tokens off;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── API proxy ──────────────────────────────────────────────────────────
    # Strip /api prefix before forwarding to the backend container
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # AI pipeline can take up to 90 seconds — set generous timeouts
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
    }

    # ── React SPA routing ──────────────────────────────────────────────────
    # All non-file routes serve index.html so React Router handles navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
