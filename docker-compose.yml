services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sourcingagent
      POSTGRES_USER: sourcingagent
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Postgres is NOT exposed on any host port — only reachable inside the Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcingagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    environment:
      DATABASE_URL:          postgresql://sourcingagent:${DB_PASSWORD}@postgres:5432/sourcingagent
      OPENAI_API_KEY:        ${OPENAI_API_KEY}
      OPENAI_MODEL:          ${OPENAI_MODEL:-gpt-4o}
      SERPER_API_KEY:        ${SERPER_API_KEY}
      ALLOWED_ORIGINS:       ${ALLOWED_ORIGINS:-http://sourcingagent.10pearls.com}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Backend is NOT exposed on any host port — only reachable via the nginx proxy

  # ── React frontend + nginx reverse proxy ──────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "80:80"       # Only this container is exposed to the outside world
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:    # Persistent DB storage — survives container restarts
